name: Automated Token Verification Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # <-- CRITICAL FIX: Downloads full history so merging works

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: Run Verification Engine
      run: python main.py

    - name: Commit and Push Database Changes
      run: |
        git config --global user.name "Automated Engine"
        git config --global user.email "actions@github.com"
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes detected in databases. Skipping commit."
        else
          git commit -m "Automated database sync: Updated verified list & removed invalid raws [skip ci]"
          
          # --- THE BULLETPROOF RETRY LOOP ---
          # Tries to push. If blocked by a website user, it waits, pulls their data, and retries.
          n=0
          until [ "$n" -ge 5 ]
          do
             git pull --rebase origin main || true
             git push && break
             n=$((n+1))
             echo "Race condition detected. Retrying push $n of 5..."
             sleep 5
          done
        fi
