name: Automated Token Verification Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Downloads full history so merging works

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: Wipe Database and Run Verification Engine
      run: |
        # --- CRITICAL FIX: Empty DB2 completely before the script runs ---
        echo "[]" > DB2_Verified.json
        
        # Now run the Python script to fill it with ONLY the fresh, working links
        python main.py

    - name: Commit and Push Database Changes
      run: |
        git config --global user.name "Automated Engine"
        git config --global user.email "actions@github.com"
        
        git add -A
        
        if git diff --staged --quiet; then
          echo "No changes detected in databases. Skipping commit."
        else
          git commit -m "Automated database sync: Updated verified list & removed invalid raws [skip ci]"
          
          # --- THE BULLETPROOF RETRY LOOP ---
          n=0
          until [ "$n" -ge 5 ]
          do
             # The '-X theirs' flag forces Git to overwrite the remote database with your fresh one
             git pull --rebase -X theirs origin main || true
             git push && break
             n=$((n+1))
             echo "Race condition detected. Retrying push $n of 5..."
             sleep 5
          done
        fi
