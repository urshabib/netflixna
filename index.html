<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal</title>
    <style>
        :root { --primary: #0284c7; --success: #22c55e; --dark: #0f172a; --light: #f8fafc; --border: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--light); color: var(--dark); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 450px; transition: max-width 0.3s ease; }
        .container.admin-mode { max-width: 800px; }
        h2 { margin-top: 0; color: var(--dark); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .hidden { display: none !important; }
        #linkResult { margin-top: 15px; padding: 15px; border-radius: 6px; word-break: break-all; font-weight: bold; background-color: #f1f5f9; text-align: center; }
        
        .stat-box { background-color: #f0fdf4; border: 2px solid var(--success); color: #166534; padding: 20px; border-radius: 8px; font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .user-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .user-table th, .user-table td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        .user-table th { background-color: #f1f5f9; }
        .admin-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn-small { width: auto; padding: 8px 15px; }
    </style>
</head>
<body>

<div class="container" id="portalContainer">
    <div id="loginView">
        <h2>Enterprise Loginnn/h2>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Access Key</label>
            <input type="password" id="password" placeholder="Enter access key">
        </div>
        <button id="loginBtn" onclick="handleLogin()">Sign In</button>
    </div>

    <div id="userDashboard" class="hidden">
        <h2>User Dashboard</h2>
        <p>Welcome, <span id="portalUser">User</span>!</p>
        <button id="claimBtn" style="background-color: var(--success);" onclick="claimLink()">Get Fresh Link</button>
        <div id="linkResult" class="hidden"></div>
        
        <button id="adminPortalBtn" class="hidden" style="margin-top: 20px; background-color: var(--dark);" onclick="switchView('adminDashboard')">Open Admin Panel</button>
    </div>

    <div id="adminDashboard" class="hidden">
        <h2>System Administration</h2>
        <div class="stat-box">Remaining Raw Files (DB1): <span id="rawCount">--</span></div>
        <div class="admin-actions">
            <button class="btn-small" style="background-color: #64748b;" onclick="switchView('userDashboard')">Back to Dashboard</button>
            <button class="btn-small" onclick="alert('User creation logic coming next!')">+ Create New User</button>
        </div>
    </div>
</div>

<script>
    // Your live Cloudflare API
    const WORKER_URL = "https://portal-api.hazemthm.workers.dev/";

    // We store credentials in memory so the user doesn't have to re-type them to get a link
    let activeUser = "";
    let activePass = "";

    async function handleLogin() {
        activeUser = document.getElementById('username').value;
        activePass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        btn.innerText = "Verifying...";
        btn.disabled = true;

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "login", username: activeUser, password: activePass })
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('userDashboard').classList.remove('hidden');
                document.getElementById('portalUser').innerText = activeUser;

                if (result.is_admin) {
                    document.getElementById('adminPortalBtn').classList.remove('hidden');
                }
            } else {
                alert("Login Failed: " + result.message);
                btn.innerText = "Sign In";
                btn.disabled = false;
            }
        } catch (error) {
            alert("Network error. Could not reach server.");
            btn.innerText = "Sign In";
            btn.disabled = false;
        }
    }

    async function claimLink() {
        const btn = document.getElementById('claimBtn');
        const resultBox = document.getElementById('linkResult');
        
        btn.innerText = "Fetching Account...";
        btn.disabled = true;
        resultBox.classList.add('hidden');

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "claim_link", username: activeUser, password: activePass })
            });

            const result = await response.json();

            if (result.success) {
                resultBox.innerText = result.url;
                resultBox.classList.remove('hidden');
                btn.innerText = "Get Another Link";
                btn.disabled = false;
            } else {
                alert("Error: " + result.message);
                btn.innerText = "Get Fresh Link";
                btn.disabled = false;
            }
        } catch (error) {
            alert("Network error. Try again.");
            btn.innerText = "Get Fresh Link";
            btn.disabled = false;
        }
    }

    function switchView(viewId) {
        const container = document.getElementById('portalContainer');
        if (viewId === 'adminDashboard') {
            container.classList.add('admin-mode');
            document.getElementById('userDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
        } else {
            container.classList.remove('admin-mode');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('userDashboard').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
